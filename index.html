<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schwarzite Carbons Database — 王朝晖课题组</title>
<meta name="description" content="王朝晖课题组 Schwarzite 碳结构数据库：结构检索、三维可视化、晶体学信息及 XYZ 坐标下载。">
<script src="./3Dmol-min.js"></script>
<style>
:root{
  --bg:#0d0f14;--panel:#141720;--border:#1e2330;
  --accent:#f0b429;--accent2:#4fd1c5;
  --text:#e2e8f0;--muted:#64748b;
  --good:#48bb78;--warn:#ed8936;--info:#63b3ed;--purple:#b794f4;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'SF Mono','Fira Code',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;background:var(--panel);flex-shrink:0;}
.logo{color:var(--accent);font-size:22px;font-weight:700;letter-spacing:.05em;}
.logo-sub{color:#e0b400;font-size:22px;font-weight:700;margin-top:4px;letter-spacing:.03em;}
.logo-badge{height:64px;width:64px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.subtitle{color:var(--muted);font-size:11px;margin-top:2px;}
.hstats{display:flex;gap:16px;margin-left:auto;}
.stat{text-align:center;}
.stat-n{color:var(--accent);font-size:18px;font-weight:700;line-height:1;}
.stat-l{color:var(--muted);font-size:10px;margin-top:2px;}
.author{color:var(--muted);font-size:11px;text-align:right;line-height:1.6;border-left:1px solid var(--border);padding-left:16px;flex-shrink:0;}
.author b{color:var(--accent);}
.main{display:flex;flex:1;overflow:hidden;}
.sidebar{width:440px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.search{padding:9px 12px;border-bottom:1px solid var(--border);}
.search input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:6px 10px;font-size:12px;font-family:inherit;outline:none;}
.search input:focus{border-color:var(--accent);}
.topo-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.topo-row{display:flex;flex-shrink:0;}
.topo-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topo-col:first-child{border-right:1px solid var(--border);}
.topo-col-header{position:sticky;top:0;background:var(--panel);color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.08em;padding:7px 10px;border-bottom:1px solid var(--border);z-index:1;text-align:center;}
.topo-other{flex-shrink:0;border-top:2px solid var(--border);}
.topo-other .topo-col-header{color:#e0b400;}
.item{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;border-left:3px solid transparent;}
.item:hover{background:rgba(240,180,41,.06);}
.item.active{background:rgba(240,180,41,.12);border-left-color:var(--accent);}
.item-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;}
.b-rcsr{background:var(--good);color:#000;}
.b-dft{background:var(--accent2);color:#000;}
.b-approx{background:var(--warn);color:#000;}
.b-construct{background:#e05d44;color:#fff;}
.b-none{background:var(--muted);color:#fff;}
.b-standard{background:linear-gradient(135deg,var(--good),var(--accent2));color:#000;}
.sc-btn{background:var(--panel);color:var(--muted);border:1px solid var(--border);
  padding:3px 8px;border-radius:3px;cursor:pointer;font-size:11px;margin-left:2px;}
.sc-btn:hover{color:var(--text);}
.sc-active{background:var(--accent)!important;color:#000!important;border-color:var(--accent)!important;}
.b-semi{background:var(--info);color:#000;}
.b-metal{background:var(--purple);color:#fff;}
.item-meta{font-size:10px;color:var(--muted);margin-top:3px;}
.viewer-panel{flex:1;display:flex;flex-direction:column;background:#080a0e;min-width:0;}
.vheader{padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.vtitle{font-size:14px;font-weight:700;}
.vsub{font-size:10px;color:var(--muted);margin-top:2px;}
.vbtns{margin-left:auto;display:flex;gap:5px;}
.vbtn{background:var(--bg);border:1px solid var(--border);color:var(--muted);padding:4px 9px;border-radius:3px;font-size:11px;cursor:pointer;font-family:inherit;}
.vbtn:hover{border-color:var(--accent);color:var(--accent);}
#vwrap{flex:1;position:relative;}
#viewer{width:100%;height:100%;}
.cbadge{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;padding:3px 12px;border-radius:4px;pointer-events:none;white-space:nowrap;}
.cb-rcsr{background:rgba(72,187,120,.15);border:1px solid var(--good);color:var(--good);}
.cb-dft{background:rgba(79,209,197,.15);border:1px solid var(--accent2);color:var(--accent2);}
.cb-approx{background:rgba(237,137,54,.15);border:1px solid var(--warn);color:var(--warn);}
.cb-none{background:rgba(100,116,139,.15);border:1px solid var(--muted);color:var(--muted);}
.info{width:260px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:12px;}
.isec{margin-bottom:14px;}
.isec-t{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:4px;margin-bottom:8px;}
.irow{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px;gap:6px;}
.ik{font-size:11px;color:var(--muted);flex-shrink:0;}
.iv{font-size:11px;color:var(--text);text-align:right;}
.iv.a{color:var(--accent);font-weight:700;}
.iv.g{color:var(--good);}
.iv.w{color:var(--warn);}
.iv.i{color:var(--info);}
.iv.c{color:var(--accent2);}
.wyckoff-table{width:100%;border-collapse:collapse;font-size:10px;margin-top:6px;}
.wyckoff-table th{color:var(--muted);font-weight:normal;padding:2px 4px;border-bottom:1px solid var(--border);text-align:left;}
.wyckoff-table td{color:var(--text);padding:2px 4px;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* Keep the existing desktop layout and allow smaller screens to scroll. */
.vheader,.vbtns{flex-wrap:wrap;}
@media(max-width:1200px){.sidebar{width:320px;}.info{width:270px;}header{flex-wrap:wrap;}.hstats{gap:12px;}.logo{font-size:19px;}}
@media(max-width:850px){body{height:auto;min-height:100vh;overflow:auto;}header{padding:12px;gap:12px;}.logo-badge{height:48px;width:48px;}.logo{font-size:16px;}.logo-sub{font-size:17px;}.hstats{width:100%;margin-left:0;justify-content:space-between;}.main{display:flex;flex-direction:column;overflow:visible;}.sidebar{width:100%;height:280px;border-right:0;}.viewer-panel{width:100%;flex:none;}#vwrap{height:440px;flex:none;}.info{width:100%;overflow:visible;border-left:0;}.vheader{gap:8px;}.vbtns{margin-left:0;gap:6px;}.vbtn{min-height:32px;}.cbadge{white-space:normal;width:max-content;max-width:94%;text-align:center;}}
</style>
</head>

  listD.innerHTML = '';
  listOther.innerHTML = '';
  var keys = Object.keys(SCHWARZITE_DATA);
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    var d = SCHWARZITE_DATA[k];
    if (q && k.toLowerCase().indexOf(q) < 0 && d.display_name.toLowerCase().indexOf(q) < 0 && String(d.n_atoms).indexOf(q) < 0) continue;
    var st = STATUS[d.coords_status] || STATUS.approximate;
    var metalBadge = '';
    if (d.electronic) {
      var metal = d.electronic === '金属';
      metalBadge = '<span class="badge ' + (metal ? 'b-metal' : 'b-semi') + '">' + (metal ? '金属' : '半导体') + '</span>';
    }
    var metaParts = [d.n_atoms + '原子'];
    if (d.space_group) metaParts.push(d.space_group);
    if (d.a) metaParts.push('a=' + d.a + 'Å');
    if (d.formula) metaParts.push(d.formula);
    var el = document.createElement('div');
    el.className = 'item' + (cur === k ? ' active' : '');
    el.setAttribute('data-key', k);
    el.innerHTML = '<div class="item-name"><span>' + d.display_name + '</span>' +
      (st.label ? '<span class="badge ' + st.cls + '">' + st.label + '</span>' : '') + metalBadge +
      '</div><div class="item-meta">' + metaParts.join(' &middot; ') + '</div>';
    el.onclick = (function(key, elem) { return function() { select(key, elem); }; })(k, el);
    var surfaceType = (k.match(/^[A-Za-z]+/) || ['?'])[0];
    var target = (surfaceType === 'D') ? listD : (surfaceType === 'P') ? listP : listOther;
    target.appendChild(el);
  }
}

function select(k, el) {
  cur = k;
  var items = document.querySelectorAll('.item');
  for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
  if (el) el.classList.add('active');
  var d = SCHWARZITE_DATA[k];
  var st = STATUS[d.coords_status] || STATUS.approximate;
  document.getElementById('vt').textContent = d.display_name + (d.common_name && d.common_name !== d.display_name ? ' (' + d.common_name + ')' : '');
  var vsParts = [];
  if (!d.hide_subtitle) {
    if (d.space_group) vsParts.push(d.space_group + (d.sg_number ? ' (#' + d.sg_number + ')' : ''));
    vsParts.push(d.n_atoms + (d.space_group ? '原子/单元胞' : '个碳原子') + (d.formula ? ' · ' + d.formula : ''));
    if (d.rings) vsParts.push(d.rings);
  }
  document.getElementById('vs').textContent = vsParts.join(' · ');
  var badge = document.getElementById('cbadge');
  if (st.text) {
    badge.style.display = 'block';
    badge.className = 'cbadge ' + st.badge;
    badge.textContent = st.text;
  } else {
    badge.style.display = 'none';
  }
  load3D(d);
  showInfo(k, d);
}

var curSC = 1;
var curData = null;

function setSC(n) {
  curSC = n;
  ['sc1','sc2','sc3'].forEach(function(id,i){
    var el=document.getElementById(id);
    if(el) el.className='sc-btn'+(i+1===n?' sc-active':'');
  });
  if(curData) load3D(curData);
}

function makeSupercellXYZ(d, n) {
  var frac = d.frac_coords;
  var a = d.a;
  var c = d.c || d.a;  // 非立方晶胞(如四方P-42m/P422)的c轴常数与a不同，之前这里
                        // 一直误用a代替c，导致z方向被错误缩放、键长键角全部算错
  if (!frac || !frac.length) return d.xyz;
  var atoms = [];
  for (var ix=0; ix<n; ix++)
    for (var iy=0; iy<n; iy++)
      for (var iz=0; iz<n; iz++)
        for (var k=0; k<frac.length; k++) {
          var f=frac[k];
          atoms.push([(f[0]+ix)*a-n*a/2,(f[1]+iy)*a-n*a/2,(f[2]+iz)*c-n*c/2]);
        }
  // 3Dmol按纯距离自动判键，不知道这是周期性晶体：边缘原子的真实化学键
  // 有一部分伸向盒子外面的相邻晶胞（未包含在这份坐标里），画出来就是
  // 悬空的"小棍+球"。这里用2-core剥离算法，只把真正的"死胡同"悬空尾巴
  // （递归剥离配位数<2的原子）过滤掉；仍属于某个环的边界原子（配位数=2）
  // 予以保留，避免误伤正常网络结构。
  var cutoff = Math.min(1.9, Math.max(1.6, (d.mean_bond || 1.43) * 1.2));
  var kept = trimToCore(atoms, cutoff);

  var lines=[kept.length.toString(), d.display_name+' '+n+'x'+n+'x'+n];
  for(var i=0;i<kept.length;i++)
    lines.push('C  '+kept[i][0].toFixed(4)+'  '+kept[i][1].toFixed(4)+'  '+kept[i][2].toFixed(4));
  return lines.join('\n');
}

function trimToCore(atoms, cutoff) {
  var n = atoms.length;
  var cell = cutoff;
  var grid = {};
  function key(ix,iy,iz){ return ix+'_'+iy+'_'+iz; }
  var cellIdx = new Array(n);
  for (var i=0;i<n;i++){
    var ix=Math.floor(atoms[i][0]/cell), iy=Math.floor(atoms[i][1]/cell), iz=Math.floor(atoms[i][2]/cell);
    cellIdx[i]=[ix,iy,iz];
    var k=key(ix,iy,iz);
    if(!grid[k]) grid[k]=[];
    grid[k].push(i);
  }
  function neighborsOf(i){
    var res=[];
    var ci=cellIdx[i];
    for(var dx=-1;dx<=1;dx++)for(var dy=-1;dy<=1;dy++)for(var dz=-1;dz<=1;dz++){
      var k=key(ci[0]+dx,ci[1]+dy,ci[2]+dz);
      var bucket=grid[k];
      if(!bucket) continue;
      for(var bi=0;bi<bucket.length;bi++){
        var j=bucket[bi];
        if(j===i) continue;
        var ax=atoms[i][0]-atoms[j][0], ay=atoms[i][1]-atoms[j][1], az=atoms[i][2]-atoms[j][2];
        var d2=ax*ax+ay*ay+az*az;
        if(d2 < cutoff*cutoff && d2 > 0.09) res.push(j);
      }
    }
    return res;
  }
  var alive = new Array(n).fill(true);
  var degree = new Array(n);
  var neighborCache = new Array(n);
  for (var i=0;i<n;i++){
    neighborCache[i]=neighborsOf(i);
    degree[i]=neighborCache[i].length;
  }
  // 迭代式2-core剥离：反复移除当前配位数<2的原子（即真正的"死胡同"
  // 悬空尾巴——只连一根键、没有参与任何环的原子），直到收敛。
  // 用2而不是3是因为：边界原子哪怕只剩2根键，只要它仍然是某个环
  // （六元环/七元环/八元环）的一部分，看起来仍然是正常网络的一部分，
  // 不会像"死胡同"那样显得像悬空的碎片；只有真正的树状悬挂尾巴才需要剥离。
  var MIN_DEGREE = 2;
  var queue=[];
  for (var i=0;i<n;i++) if(degree[i]<MIN_DEGREE) queue.push(i);
  var qi=0;
  while(qi<queue.length){
    var u=queue[qi++];
    if(!alive[u]) continue;
    alive[u]=false;
    var nbrs=neighborCache[u];
    for(var t=0;t<nbrs.length;t++){
      var v=nbrs[t];
      if(alive[v]){
        degree[v]--;
        if(degree[v]<MIN_DEGREE) queue.push(v);
      }
    }
  }
  // 2-core过滤后，有些原子团块内部自成环（因此逃过了上面的悬空尾巴剥离），
  // 但它与主体之间的连接恰好全部是穿过晶胞边界、被裁掉的键——结果就是
  // 一整块完全独立于主体、飘在旁边的"孤岛"碎片。这里用连通分量分析，
  // 只保留原子数最多的那一个连通分量，把这些孤岛也一并剔除。
  var aliveIdx = [];
  for (var i=0;i<n;i++) if(alive[i]) aliveIdx.push(i);
  var visited = {};
  var components = [];
  for (var ai=0; ai<aliveIdx.length; ai++) {
    var start = aliveIdx[ai];
    if (visited[start]) continue;
    var comp = [];
    var stack = [start];
    visited[start] = true;
    while (stack.length) {
      var u = stack.pop();
      comp.push(u);
      var nbrs = neighborCache[u];
      for (var t=0;t<nbrs.length;t++) {
        var v = nbrs[t];
        if (alive[v] && !visited[v]) {
          visited[v] = true;
          stack.push(v);
        }
      }
    }
    components.push(comp);
  }
  if (!components.length) return [];
  var mainComp = components[0];
  for (var ci=1; ci<components.length; ci++) {
    if (components[ci].length > mainComp.length) mainComp = components[ci];
  }
  var mainSet = {};
  for (var mi=0; mi<mainComp.length; mi++) mainSet[mainComp[mi]] = true;

  var kept=[];
  for(var i=0;i<n;i++) if(alive[i] && mainSet[i]) kept.push(atoms[i]);
  return kept;
}

function load3D(d) {
  curData = d;
  var el = document.getElementById('viewer');
  if (!viewer) viewer = $3Dmol.createViewer(el, {backgroundColor: '#080a0e'});
  else viewer.clear();
  if (!d.xyz && !d.frac_coords) { viewer.render(); return; }
  var xyz = makeSupercellXYZ(d, curSC);
  viewer.addModel(xyz, 'xyz');
  applyStyle();
  viewer.zoomTo();
  viewer.render();
  if (spinOn) viewer.spin('y', 1);
}

function toggleSpin() {
  spinOn = !spinOn;
  if (!viewer) return;
  if (spinOn) { viewer.spin('y', 1); }
  else { viewer.spin(false); }
  var btn = document.getElementById('spinBtn');
  if (btn) btn.textContent = spinOn ? '⏸ 停止自转' : '▶ 开始自转';
}

function applyStyle() {
  if (!viewer) return;
  viewer.setStyle({}, {});
  if (curStyle === 'stick') viewer.setStyle({}, {stick: {radius: 0.12, colorscheme: 'Jmol'}});
  else if (curStyle === 'sphere') viewer.setStyle({}, {sphere: {radius: 0.35, colorscheme: 'Jmol'}});
  else viewer.setStyle({}, {line: {colorscheme: 'Jmol', linewidth: 2}});
  viewer.render();
}

function sStyle(s) { curStyle = s; applyStyle(); }
function doZoom() { if (viewer) { viewer.zoomTo(); viewer.render(); } }

function showInfo(k, d) {
  var p = document.getElementById('info');
  var st = STATUS[d.coords_status] || STATUS.approximate;
  var bg = d.bandgap_eV !== null && d.bandgap_eV !== undefined ? d.bandgap_eV + ' eV (间接带隙)' : '— (金属)';
  var bond = d.mean_bond ? d.mean_bond + ' Å' : '—';
  var statClass = d.coords_status === 'exact_RCSR' ? 'g' : d.coords_status === 'exact_DFT' ? 'c' : (d.coords_status === 'constructed_approximate' ? 'w' : 'w');
  var isValidated = (d.coords_status === 'exact_DFT' || d.coords_status === 'exact_RCSR' || d.coords_status === 'exact_standard');

  var wyckHtml = '';
  if (d.wyckoff && d.wyckoff.length > 0) {
    wyckHtml = '<div class="isec"><div class="isec-t">Wyckoff位置（Im-3m）</div>' +
      '<table class="wyckoff-table"><tr><th>位点</th><th>Wyckoff</th><th>x</th><th>y</th><th>z</th></tr>';
    for (var i = 0; i < d.wyckoff.length; i++) {
      var w = d.wyckoff[i];
      wyckHtml += '<tr><td>' + w.label + '</td><td>' + w.site + '</td><td>' + w.x + '</td><td>' + w.y + '</td><td>' + w.z + '</td></tr>';
    }
    wyckHtml += '</table><div style="font-size:10px;color:var(--muted);margin-top:5px">来源：RCSR mct数据库</div></div>';
  }

  var warnHtml = '';
  if (d.warning) {
    warnHtml = '<div class="isec" style="border:1px solid #e05d44;border-radius:6px;padding:8px;">' +
      '<div class="isec-t" style="color:#e05d44;">⚠ 重要说明</div>' +
      '<div style="font-size:10px;color:var(--text);line-height:1.6;">' + d.warning + '</div></div>';
  }

  var basicRows = '';
  basicRows += '<div class="irow"><span class="ik">Tagami命名</span><span class="iv a">' + (d.tagami_name || '—') + '</span></div>';
  if (d.common_name && d.common_name !== d.display_name) basicRows += '<div class="irow"><span class="ik">通用名</span><span class="iv">' + d.common_name + '</span></div>';
  if (d.space_group) basicRows += '<div class="irow"><span class="ik">空间群</span><span class="iv">' + d.space_group + (d.sg_number ? ' (#' + d.sg_number + ')' : '') + '</span></div>';
  if (d.a) basicRows += '<div class="irow"><span class="ik">晶格参数 a</span><span class="iv">' + d.a + ' Å</span></div>';
  if (d.density) basicRows += '<div class="irow"><span class="ik">密度</span><span class="iv">' + d.density + ' g/cm³</span></div>';
  if (d.formula) basicRows += '<div class="irow"><span class="ik">分子式</span><span class="iv">' + d.formula + '</span></div>';

  var crystRows = '';
  crystRows += '<div class="irow"><span class="ik">' + (d.space_group ? '原子数/单元胞' : '碳原子数') + '</span><span class="iv a">' + d.n_atoms + '</span></div>';
  if (d.n_H) crystRows += '<div class="irow"><span class="ik">氢原子数</span><span class="iv">' + d.n_H + '</span></div>';
  crystRows += '<div class="irow"><span class="ik">平均键长</span><span class="iv">' + bond + '</span></div>';
  if (isValidated) crystRows += '<div class="irow"><span class="ik">声子稳定性</span><span class="iv g">✓ 全正频（DFT）</span></div>';

  var elecHtml = '';
  if (d.electronic) {
    elecHtml = '<div class="isec"><div class="isec-t">电子性质（DFT）</div>' +
      '<div class="irow"><span class="ik">导电性</span><span class="iv ' + (d.electronic === '金属' ? 'a' : 'i') + '">' + d.electronic + '</span></div>' +
      '<div class="irow"><span class="ik">带隙</span><span class="iv">' + bg + '</span></div></div>';
  }

  p.innerHTML =
    '<div class="isec"><div class="isec-t">基本信息</div>' + basicRows + '</div>' +
    '<div class="isec"><div class="isec-t">' + (d.space_group ? '晶体学数据' : '结构数据') + '</div>' + crystRows +
    (d.rings ? '<div class="irow"><span class="ik">环类型</span></div><div style="font-size:10px;color:var(--text);margin-top:2px;line-height:1.7;">' + d.rings + '</div>' : '') +
    '</div>' +
    elecHtml +
    warnHtml +
    '<div class="isec"><div class="isec-t">坐标信息</div>' +
    (st.label ? '<div class="irow"><span class="ik">精度</span><span class="iv ' + statClass + '">' + st.label + '</span></div>' : '') +
    '<div style="font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5;">' + d.source + '</div>' +
    '</div>' +
    wyckHtml +
    '<div class="isec"><div class="isec-t">参考文献</div>' +
    '<div style="font-size:10px;color:var(--muted);line-height:1.6;">' + d.ref + '</div>' +
    '</div>';
}

function dlXYZ() {
  if (!cur) return;
  var d = SCHWARZITE_DATA[cur];
  if (!d.xyz) { alert('该结构暂无坐标数据。'); return; }
  // 之前这里无论界面上选的是1x1x1/2x2x2/3x3x3，下载的都是原始
  // d.xyz（永远是1x1x1单胞坐标），跟3D视图实际展示的超胞完全对不上。
  // 现在改为：curSC=1时仍导出精确的原始单胞坐标（与n_atoms等元数据
  // 完全对应，不经过trimToCore裁剪，避免引入任何变化）；curSC=2/3时
  // 改为调用和load3D()相同的makeSupercellXYZ(d, curSC)，导出真正
  // 周期拼接、并做过2-core悬键剥离+孤岛剔除的超胞坐标。
  var xyzText = (curSC === 1) ? d.xyz : makeSupercellXYZ(d, curSC);
  var blob = new Blob([xyzText], {type: 'text/plain'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  var suffix = curSC + 'x' + curSC + 'x' + curSC;
  a.download = d.tagami_name + (curSC === 1 ? '' : ('_' + suffix)) + '.xyz';
  a.click();
}

document.getElementById('search').addEventListener('input', function(e) {
  buildList(e.target.value.toLowerCase());
});

buildList();
setTimeout(function() {
  var first = document.querySelector('.item');
  if (first) first.click();
}, 200);
</script>
